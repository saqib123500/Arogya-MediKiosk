$kind: http-request
name: Health Check
order: 1000
url: 'http://localhost:9000/api'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Welcome message present", function () {
        const json = pm.response.json();
        pm.expect(json.message).to.include("two factor");
      });
