<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Intake — Choose Your Language</title>

<style>
  :root{
    --paper:#efe9dd;
    --ink:#1f2420;
    --line:#c9c0ac;
    --accent:#5c6b4f;
    --accent-2:#a1462f;
    --card:#f7f3e9;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    padding:48px 24px;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ================= LANGUAGE SCREEN ================= */

  #langScreen{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .masthead{
    max-width:720px;
    text-align:center;
    margin-bottom:40px;
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
  }

  h1{
    font-size:2.4rem;
    font-weight:400;
    letter-spacing:0.5px;
    margin:0 0 10px;
  }

  .masthead p{
    font-size:1rem;
    color:#565f52;
    margin:0;
    line-height:1.5;
  }

  /* ================= LANGUAGE GRID ================= */

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    max-width:920px;
    width:100%;
  }

  @media (max-width:760px){
    .grid{
      grid-template-columns:repeat(2, 1fr);
    }
  }

  @media (max-width:480px){
    .grid{
      grid-template-columns:1fr;
      max-width:340px;
    }

    h1{
      font-size:1.9rem;
    }
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 10px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;

    transition:
      transform 0.12s ease,
      box-shadow 0.12s ease,
      border-color 0.12s ease;
  }

  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 14px rgba(0,0,0,0.10);
    border-color:var(--accent);
  }

  .card.speaking{
    border-color:var(--accent-2);
    background:#f3e7de;
  }

  .card.speaking .native{
    color:var(--accent-2);
  }

  .card.disabled{
    opacity:0.45;
    pointer-events:none;
  }

  /* ================= LANGUAGE TEXT ================= */

  .symbol{
    font-size:2.6rem;
    line-height:1.1;
    text-align:center;
    font-weight:600;
    color:var(--ink);
    margin-top:4px;
  }

  .native{
    font-size:1.15rem;
    line-height:1.2;
    text-align:center;
    margin-top:2px;
  }

  .english{
    font-size:0.72rem;
    letter-spacing:0.4px;
    color:#7a7264;
    margin-bottom:4px;
  }

  .tap-hint{
    font-size:0.68rem;
    color:#8a8272;
    margin-top:2px;
  }

  /* ================= AUDIO WAVE ================= */

  .wave{
    position:absolute;
    top:8px;
    right:10px;

    display:flex;
    align-items:flex-end;

    width:14px;
    height:14px;

    opacity:0;

    transition:opacity 0.12s ease;
  }

  .card.speaking .wave{
    opacity:1;
  }

  .wave span{
    display:inline-block;

    width:2px;
    height:6px;

    margin-right:1px;

    background:var(--accent-2);

    animation:bounce 0.7s infinite ease-in-out;
  }

  .wave span:nth-child(2){
    animation-delay:0.15s;
  }

  .wave span:nth-child(3){
    animation-delay:0.3s;
  }

  @keyframes bounce{
    0%,100%{
      height:4px;
    }

    50%{
      height:12px;
    }
  }

  /* ================= STATUS ================= */

  .status-bar{
    max-width:720px;
    width:100%;

    margin-top:28px;

    min-height:26px;

    text-align:center;

    font-size:0.92rem;

    color:var(--accent-2);
  }

  .footnote{
    max-width:720px;

    margin-top:20px;

    font-size:0.8rem;

    color:#7a7264;

    text-align:center;

    line-height:1.5;
  }

</style>

</head>

<body>

<!-- =========================================================
     HOME / LANGUAGE SELECTION
========================================================= -->

<div id="langScreen">

  <div class="masthead">

    <h1>भाषाएँ — Languages of India</h1>

    <p>
      Tap your language. You'll hear a short welcome message
      in that language before continuing to login.
    </p>

  </div>


  <!-- LANGUAGE CARDS -->

  <div class="grid" id="grid"></div>


  <!-- STATUS MESSAGE -->

  <div
    class="status-bar"
    id="statusBar"
  ></div>


  <div class="footnote">
    Select the language you are most comfortable with.
  </div>

</div>


<script>

/* ============================================================
   LANGUAGE DATA
============================================================ */

const languages = [

  {
    native: "हिन्दी",
    english: "Hindi",
    symbol: "हिं",
    gttsCode: "hi",
    speechCode: "hi-IN",
    googleTts: true,
    welcome:
      "नमस्ते! हम आपकी मदद करेंगे। पहले लॉगिन करें।"
  },

  {
    native: "বাংলা",
    english: "Bengali",
    symbol: "বং",
    gttsCode: "bn",
    speechCode: "bn-IN",
    googleTts: true,
    welcome:
      "নমস্কার! আমরা আপনাকে সাহায্য করব। প্রথমে লগইন করুন।"
  },

  {
    native: "తెలుగు",
    english: "Telugu",
    symbol: "తె",
    gttsCode: "te",
    speechCode: "te-IN",
    googleTts: true,
    welcome:
      "నమస్తే! మేము మీకు సహాయం చేస్తాము. ముందుగా లాగిన్ చేయండి."
  },

  {
    native: "मराठी",
    english: "Marathi",
    symbol: "म",
    gttsCode: "mr",
    speechCode: "mr-IN",
    googleTts: true,
    welcome:
      "नमस्कार! आम्ही तुम्हाला मदत करू. प्रथम लॉगिन करा."
  },

  {
    native: "தமிழ்",
    english: "Tamil",
    symbol: "த",
    gttsCode: "ta",
    speechCode: "ta-IN",
    googleTts: true,
    welcome:
      "வணக்கம்! நாங்கள் உங்களுக்கு உதவுவோம். முதலில் உள்நுழையவும்."
  },

  {
    native: "ગુજરાતી",
    english: "Gujarati",
    symbol: "ગુ",
    gttsCode: "gu",
    speechCode: "gu-IN",
    googleTts: true,
    welcome:
      "નમસ્તે! અમે તમારી મદદ કરીશું. પહેલા લૉગિન કરો."
  },

  {
    native: "ਪੰਜਾਬੀ",
    english: "Punjabi",
    symbol: "ਪੰ",
    gttsCode: "pa",
    speechCode: "pa-IN",
    googleTts: true,
    welcome:
      "ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਅਸੀਂ ਤੁਹਾਡੀ ਮਦਦ ਕਰਾਂਗੇ। ਪਹਿਲਾਂ ਲੌਗਇਨ ਕਰੋ।"
  },

  {
    native: "ಕನ್ನಡ",
    english: "Kannada",
    symbol: "ಕ",
    gttsCode: "kn",
    speechCode: "kn-IN",
    googleTts: true,
    welcome:
      "ನಮಸ್ಕಾರ! ನಾವು ನಿಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತೇವೆ. ಮೊದಲು ಲಾಗಿನ್ ಮಾಡಿ."
  },

  {
    native: "മലയാളം",
    english: "Malayalam",
    symbol: "മ",
    gttsCode: "ml",
    speechCode: "ml-IN",
    googleTts: true,
    welcome:
      "നമസ്കാരം! ഞങ്ങൾ നിങ്ങളെ സഹായിക്കും. ആദ്യം ലോഗിൻ ചെയ്യുക."
  },

  {
    native: "اردو",
    english: "Urdu",
    symbol: "ع",
    gttsCode: "ur",
    speechCode: "ur-IN",
    googleTts: true,
    welcome:
      "السلام علیکم! ہم آپ کی مدد کریں گے۔ پہلے لاگ ان کریں۔"
  },

  {
    native: "नेपाली",
    english: "Nepali",
    symbol: "ने",
    gttsCode: "ne",
    speechCode: "ne-IN",
    googleTts: true,
    welcome:
      "नमस्ते! हामी तपाईंलाई मद्दत गर्नेछौं। पहिले लगइन गर्नुहोस्।"
  }

];


/* ============================================================
   DOM REFERENCES
============================================================ */

const grid =
  document.getElementById("grid");

const statusBar =
  document.getElementById("statusBar");

const supportsSpeech =
  "speechSynthesis" in window;


/* ============================================================
   BROWSER VOICES
============================================================ */

let voices = [];


function loadVoices(){

  voices =
    window.speechSynthesis.getVoices();

}


if(supportsSpeech){

  loadVoices();

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* ============================================================
   FIND BROWSER VOICE
============================================================ */

function pickVoice(code){

  if(!voices.length){
    return null;
  }

  const base =
    code.split("-")[0];


  return (

    voices.find(
      v =>
        v.lang.toLowerCase() ===
        code.toLowerCase()
    )

    ||

    voices.find(
      v =>
        v.lang.toLowerCase()
        .startsWith(
          base.toLowerCase()
        )
    )

    ||

    null

  );

}


/* ============================================================
   AUDIO
============================================================ */

let currentAudioEl = null;


function playAudioUrl(url){

  return new Promise(
    (resolve,reject) => {

      const audio =
        new Audio(url);

      currentAudioEl =
        audio;


      audio.onended =
        resolve;


      audio.onerror =
        () =>
          reject(
            new Error("audio error")
          );


      audio
        .play()
        .catch(reject);

    }
  );

}


/* ============================================================
   GOOGLE TTS
============================================================ */

function playGoogleTts(lang){

  if(!lang.googleTts){

    return Promise.reject(
      new Error("no Google voice")
    );

  }


  const url =
    "https://translate.google.com/translate_tts" +
    "?ie=UTF-8&client=tw-ob" +
    "&tl=" +
    encodeURIComponent(
      lang.gttsCode
    ) +
    "&q=" +
    encodeURIComponent(
      lang.welcome
    );


  return playAudioUrl(url);

}


/* ============================================================
   BROWSER SPEECH FALLBACK
============================================================ */

function playBrowserVoice(lang){

  return new Promise(
    (resolve,reject) => {

      if(!supportsSpeech){

        return reject(
          new Error(
            "no speechSynthesis"
          )
        );

      }


      const voice =
        pickVoice(
          lang.speechCode
        );


      if(!voice){

        return reject(
          new Error(
            "no installed voice"
          )
        );

      }


      const utterance =
        new SpeechSynthesisUtterance(
          lang.welcome
        );


      utterance.lang =
        lang.speechCode;

      utterance.rate =
        0.9;

      utterance.voice =
        voice;


      utterance.onend =
        resolve;


      utterance.onerror =
        () =>
          reject(
            new Error(
              "speechSynthesis error"
            )
          );


      window
        .speechSynthesis
        .speak(utterance);

    }
  );

}


/* ============================================================
   STATE
============================================================ */

let isTransitioning = false;

let activeCard = null;

let proceedCalled = false;


/* ============================================================
   STOP AUDIO
============================================================ */

function stopAnyPlayback(){

  if(currentAudioEl){

    currentAudioEl.pause();

    currentAudioEl.currentTime =
      0;

    currentAudioEl = null;

  }


  if(supportsSpeech){

    window
      .speechSynthesis
      .cancel();

  }

}


/* ============================================================
   GO TO LOGIN
============================================================ */

function goToLogin(lang){

  if(proceedCalled){
    return;
  }


  proceedCalled = true;


  stopAnyPlayback();


  if(activeCard){

    activeCard.classList.remove(
      "speaking"
    );

  }


  /*
    Selected language is passed
    to login.html.

    Example:

    /patient/login/?language=Hindi
  */

  window.location.href =
    "{% url 'login' %}?language=" +
    encodeURIComponent(
      lang.english
    );

}


/* ============================================================
   PLAY WELCOME → LOGIN
============================================================ */

async function playWelcomeThenProceed(lang){

  const strategies = [

    () =>
      playGoogleTts(lang),

    () =>
      playBrowserVoice(lang)

  ];


  for(
    const attempt
    of strategies
  ){

    if(proceedCalled){
      return;
    }


    try{

      await attempt();


      goToLogin(lang);


      return;

    }

    catch(error){

      // Try the next voice method.

    }

  }


  /* ==========================================================
     TEXT FALLBACK
  ========================================================== */

  if(proceedCalled){
    return;
  }


  statusBar.textContent =
    "Voice unavailable for " +
    lang.english +
    ". Continuing to login...";


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        2500
      )
  );


  goToLogin(lang);

}


/* ============================================================
   CREATE LANGUAGE CARDS
============================================================ */

languages.forEach(
  lang => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    card.innerHTML = `

      <span class="wave">

        <span></span>
        <span></span>
        <span></span>

      </span>


      <span
        class="symbol"
        lang="${lang.speechCode}"
      >
        ${lang.symbol}
      </span>


      <span
        class="native"
        lang="${lang.speechCode}"
      >
        ${lang.native}
      </span>


      <span class="english">
        ${lang.english}
      </span>


      <span class="tap-hint">
        tap to select
      </span>

    `;


    /* ========================================================
       CARD CLICK
    ======================================================== */

    card.addEventListener(
      "click",
      () => {

        /*
          Second tap skips the audio
          and immediately opens login.
        */

        if(
          isTransitioning &&
          activeCard === card
        ){

          goToLogin(lang);

          return;

        }


        if(isTransitioning){
          return;
        }


        isTransitioning =
          true;

        proceedCalled =
          false;

        activeCard =
          card;


        card.classList.add(
          "speaking"
        );


        document
          .querySelectorAll(
            ".card"
          )
          .forEach(
            otherCard => {

              if(
                otherCard !== card
              ){

                otherCard.classList.add(
                  "disabled"
                );

              }

            }
          );


        statusBar.textContent =
          "“" +
          lang.welcome +
          "”";


        playWelcomeThenProceed(
          lang
        );

      }
    );


    grid.appendChild(card);

  }
);


/* ============================================================
   RESET PAGE STATE
============================================================ */

window.addEventListener(
  "pageshow",
  () => {

    isTransitioning =
      false;

    activeCard =
      null;

    proceedCalled =
      false;

    statusBar.textContent =
      "";


    document
      .querySelectorAll(
        ".card"
      )
      .forEach(
        card => {

          card.classList.remove(
            "disabled",
            "speaking"
          );

        }
      );

  }
);

</script>

</body>
</html>
