<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Successful</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7f6;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 50px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #dcfce7;

            color: #16a34a;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 15px;
            color: #1f2937;
        }

        p {
            margin-bottom: 30px;
            color: #6b7280;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;

            background: #2563eb;
            color: white;

            text-decoration: none;
            border-radius: 8px;

            font-size: 16px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .continue-button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
}

.continue-button:hover {
    background: #1d4ed8;
}
    </style>
</head>

<body>
    

    <div class="container">

        <div class="icon">
            ✓
        </div>

        <h1>Verification Successful</h1>

        <p>
            Your ABHA ID has been successfully verified.
        </p>

        <a
            href="{% url 'patient_form' %}"
            class="button"
        >
            Continue
        </a>

    </div>

    <a
    href="{% url 'medical_document_upload' %}"
    class="continue-button"
>
    Continue to Medical Documents
</a>

</body>

</html>
